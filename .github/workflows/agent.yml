name: YouTube Auto Upload — Mind Rewired

on:
  schedule:
    # Daily 6:30 PM IST = 1:00 PM UTC
    - cron: '0 13 * * *'

  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set upload slot
        run: echo "SLOT=evening" >> $GITHUB_ENV

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run upload agent
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
          DRIVE_FOLDER_ID:  ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_API_KEY:    ${{ secrets.DRIVE_API_KEY }}
          MANAGER_URL:      ${{ secrets.MANAGER_URL }}
          API_SECRET:       ${{ secrets.API_SECRET }}
          SLOT:             ${{ env.SLOT }}
        run: python main.py

      - name: Commit uploaded.txt back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded.txt
          git diff --staged --quiet || git commit -m "chore: upload [evening] [skip ci]"
          git push
